services:
  db:
    image: postgres:16
    restart: unless-stopped
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=20", "-c", "work_mem=4MB"]  # small-instance friendly
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }   # keep container logs from filling a small disk
    environment:
      POSTGRES_USER: scraper
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: scraper
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["127.0.0.1:5432:5432"]   # reachable from the server itself only; use an SSH tunnel for remote access
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scraper -d scraper"]
      interval: 5s
      retries: 10

  scraper:
    build: .
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }   # keep container logs from filling a small disk
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://scraper:${POSTGRES_PASSWORD}@db:5432/scraper
      SINGLEQR_LEADS_URL: ${SINGLEQR_LEADS_URL:-}
      SINGLEQR_LEADS_API_KEY: ${SINGLEQR_LEADS_API_KEY:-}
      SYNC_BOTH_STORES_ONLY: ${SYNC_BOTH_STORES_ONLY:-true}
    volumes:
      - ./config.json:/app/config.json:ro
      - ./data:/app/data            # only used by `--export`

  dashboard:
    build: .
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }   # keep container logs from filling a small disk
    command: ["python", "dashboard.py"]
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://scraper:${POSTGRES_PASSWORD}@db:5432/scraper
      HOST: 0.0.0.0
      PORT: "8080"
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:-}
    volumes:
      - ./config.json:/app/config.json:ro
    ports: ["127.0.0.1:8080:8080"]   # the server itself only; use an SSH tunnel or a reverse proxy with HTTPS

volumes:
  pgdata:
