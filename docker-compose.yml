services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: scraper
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: scraper
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["127.0.0.1:5432:5432"]   # reachable from the server itself only; use an SSH tunnel for remote access
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scraper -d scraper"]
      interval: 5s
      retries: 10

  scraper:
    build: .
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://scraper:${POSTGRES_PASSWORD}@db:5432/scraper
    volumes:
      - ./config.json:/app/config.json:ro
      - ./data:/app/data            # only used by `--export`
volumes:
  pgdata:
